            Data: {"baseId":"dnn16101","url":"/DesktopModules/DnnSharp/ActionForm/AdminApi.ashx?method=FormSettings\u0026_mid=16101\u0026tabid=5308\u0026_aliasid=140\u0026referrer=\u0026openMode=Always\u0026_url=https%3a%2f%2fidahostars.org%2fProvider-Detail%2fID%2f3657\u0026ID=3657\u0026language=en-US","submitUrl":"/DesktopModules/DnnSharp/ActionForm/Submit.ashx?openMode=Always\u0026ID=3657\u0026language=en-US\u0026_aliasid=140\u0026_mid=16101\u0026_tabid=5308","getItemsUrl":"/API/DnnSharp/ActionForm/Datasources/GetItems?openMode=Always\u0026ID=3657\u0026language=en-US\u0026_aliasid=140\u0026_mid=16101\u0026_tabid=5308","submissionKey":"64a25a41-f39d-4b41-b64d-99f110a95067","fields":{"StaticText":{"id":"dnn16101StaticText","name":"StaticText","type":"static-text","hasValue":true,"fieldId":5184,"actionCount":0,"value":"\u003cstrong\u003e1st steps\u003c/strong\u003e\n\u003c!-- \u003cdiv class=\u0022row\u0022\u003e\n    \u003cdiv class=\u0022col-4\u0022\u003e\nID (Testing): 3657\n    \u003c/div\u003e\n    \u003cdiv class=\u0022col-4\u0022\u003e\nAlternate Rise ID (Testing): 20607\n    \u003c/div\u003e\n    \u003cdiv class=\u0022col-4\u0022\u003e\n            Web Referral (Testing): Yes\n    \u003c/div\u003e\n\u003c/div\u003e --\u003e\n\u003cdiv class=\u0022row\u0022\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n        5675 E Franklin Rd\u003cbr\u003e\n        Nampa, ID 83687\u003cbr\u003e\n        (208) 546-0391\u003cbr\u003e\n        \u003ca href=\u0022mailto:firststepsnampa@aol.com\u0022\u003efirststepsnampa@aol.com\u003c/a\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n        \u003ca href=\u0022https://www.idahochildcarecheck.org/provider/20607\u0022 target=\u0022_blank\u0022\u003eView this facility\u0027s Health \u0026 Safety Reports\u003c/a\u003e\u003cbr\u003e\n        \u003cstrong\u003eWebsite:\u003c/strong\u003e \u003ca href=\u0022http://1ststepsdaycare.org\u0022 target=\u0022_blank\u0022\u003e1ststepsdaycare.org\u003c/a\u003e\u003cbr\u003e\n        \u003cstrong\u003eFacebook:\u003c/strong\u003e \u003ca href=\u0022http://\u0022 target=\u0022_blank\u0022\u003e\u003c/a\u003e\n    \u003c/div\u003e\n\u003c/div\u003e\n\u003chr\u003e\n\u003cdiv class=\u0022class row\u0022\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n\u003cstrong\u003eDirector Name:\u003c/strong\u003e Briana Mahaffey\u003cbr\u003e\n\u003cstrong\u003eFacility Type:\u003c/strong\u003e Large Child Care Center (26 or more children)\u003cbr\u003e\n\u003c!-- \u003cstrong\u003eAre there openings available:\u003c/strong\u003e Yes\u003cbr\u003e\n\u003cstrong\u003eNumber of Openings:\u003c/strong\u003e \u003cbr\u003e\n\u003cstrong\u003eIs there a waitlist:\u003c/strong\u003e \u003cbr\u003e --\u003e\n\u003cstrong\u003eNational Accreditation:\u003c/strong\u003e NOT Nationally Accredited\u003cbr\u003e\n\u003cstrong\u003eComment on Accreditation:\u003c/strong\u003e \n    \u003c/div\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n\u003cstrong\u003eQuality Achiever Status:\u003c/strong\u003e Eligible\u003cbr\u003e\n\u003cstrong\u003eQuality Achievement(s):\u003c/strong\u003e \u003cbr\u003e\n\u003cstrong\u003eICCP Status:\u003c/strong\u003e Pending Renewal \u003cbr\u003e\n\u003cstrong\u003eLicense Status:\u003c/strong\u003e Pending Renewal\u003cbr\u003e\n\u003cstrong\u003eProgram Philosophy:\u003c/strong\u003e Other\u003cbr\u003e\n\u003cstrong\u003ePhilosophy Comment:\u003c/strong\u003e We use Homeschooling mixed with play. We cover all areas of curriculum including science.\u003cbr\u003e\n\u003cstrong\u003ePhilosophy Description:\u003c/strong\u003e We want kiddos to understand, not just do work. \n    \u003c/div\u003e\n\u003c/div\u003e\n\u003chr\u003e\n\u003cdiv class=\u0022class row\u0022\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n\u003c!-- Participating in USDA Food Program: False\u003cbr\u003e --\u003e\n\u003cstrong\u003eProgram Description:\u003c/strong\u003e Accepts ages 6 weeks to 5 years old, up to 12 years if needed for summer of after school care. We do not transport.. Preschool Curriculum. Low Ratio\u0027s. \u003cbr\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n\u003cstrong\u003eParticipating in USDA Food Program:\u003c/strong\u003e No\u003cbr\u003e\n\u003cstrong\u003eFamily Style Dining:\u003c/strong\u003e Yes \u003cbr\u003e\n\u003cstrong\u003eOther Opportunities at this Center:\u003c/strong\u003e No\u003cbr\u003e\n\u003cstrong\u003eOpportunities Comment:\u003c/strong\u003e Outdoor play is done inside\n    \u003c/div\u003e\n\u003c/div\u003e\n\u003chr\u003e\n\u003cdiv class=\u0022class row\u0022\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n\u003cstrong\u003eConsistent Daily Schedule:\u003c/strong\u003e Yes\u003cbr\u003e\n\u003cstrong\u003eConsistent Daily Schedule Comment:\u003c/strong\u003e \n\n    \u003c/div\u003e\n    \u003cdiv class=\u0022col-6\u0022\u003e\n\u003cstrong\u003ePolicy on Pets:\u003c/strong\u003e Pet Free\u003cbr\u003e\n\u003cstrong\u003ePolicy on Pets Comment:\u003c/strong\u003e \n    \u003c/div\u003e\n\u003c/div\u003e\n\u003chr\u003e\n\u003cdiv class=\u0022class row\u0022 style=\u0022text-align:center;\u0022\u003e\n    \u003cdiv class=\u0022col-12\u0022\u003e\n            \u003cp\u003e\u003ci\u003ePlease contact a Resource Specialist by calling 211 for additional assistance, information, and support as needed. IdahoSTARS Resource Specialists are available to support families with finding child care.\u003c/i\u003e\n            \u003c/p\u003e\n        \u003cp\u003e\u003ci\u003eIdahoSTARS Child Care Resource Centers (CCRCs) provide child care referrals to families seeking care, not program recommendations. We refer families to both licensed and exempt child care programs, and do not guarantee the accuracy of information, as child care owners and directors provide their program’s information to IdahoSTARS. We urge families to call child care programs to schedule an appointment, and to carefully interview, evaluate, monitor, and check references before leaving a child in care.\u003c/i\u003e\n        \u003c/p\u003e\n        \u003cp\u003e\u003ci\u003eIdahoSTARS, the University of Idaho, and the Idaho Department of Health and\n                Welfare do not recommend or endorse any particular child care facility.\u003c/i\u003e\n        \u003c/p\u003e\n    \u003c/div\u003e\n\u003c/div\u003e"}}},
